# Prometheus for the telemetry profile: scrapes the playground BFF's /metrics (computed from every
# saved run, see apps/playground-bff/src/telemetry/metrics.ts).
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: playground-bff
    metrics_path: /metrics
    static_configs:
      - targets: ["playground-bff:3001"]
