# Public address of the issuer. Override in injistack/.env (not committed), e.g. CERTIFY_PUBLIC_HOST=certify.example.test
#   CERTIFY_PUBLIC_HOST  hostname in metadata, offers, token audiences and the did:web identifier (default certify.localhost)
#   CERTIFY_DID          issuer did:web identifier (default did:web:${CERTIFY_PUBLIC_HOST}%3A8443). tunnel-up.sh sets
#                        a portless DID: Inji Verify's and Inji Wallet's did:web resolvers do not decode "%3A<port>"
#   CERTIFY_FLOW         preauth (default): Certify issues its own tokens for pre-authorized offers and builds
#                        credentials from the offer's claims. esignet: Certify trusts eSignet tokens and reads the
#                        farmer CSV, for the Mimoto / Inji Web flow (config/certify-<flow>.properties)
#   VERIFY_PUBLIC_HOST   Inji Verify's public hostname (default verify.localhost), served by the same gateway on :8443
#   VERIFY_PUBLIC_URL    base URL wallets use for request_uri / response_uri (default https://${VERIFY_PUBLIC_HOST}:8443);
#                        set it to a tunnel URL (e.g. https://verify.example.com) when a phone must reach Verify
#   VERIFY_DID           Verify's did:web client id; must resolve to ${VERIFY_PUBLIC_URL}/v1/verify/did.json
#                        (default did:web:verify.localhost%3A8443:v1:verify)
#   MOCK_VERIFIER_DID    the mock verifier's did:web client id; must resolve to ${VERIFY_PUBLIC_URL}/mock-verifier/did.json
#                        (default derived from VERIFY_PUBLIC_URL; tunnel-up.sh sets a portless one)
#   PLAYGROUND_UI_MOCKS  true builds the UI with in-browser mocks instead of the BFF (default false)
# Java services trust the local CA made by the certs service through this truststore.
x-local-ca-java: &local-ca-java "-Djavax.net.ssl.trustStore=/certs/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12"

services:
  # One-shot: local CA, HTTPS certificate for CERTIFY_PUBLIC_HOST and a Java truststore (scripts/make-local-certs.sh).
  certs:
    image: injistack/inji-verify-service:0.18.2
    user: root
    entrypoint: ["/bin/sh", "/scripts/make-local-certs.sh"]
    environment:
      CERTIFY_PUBLIC_HOST: ${CERTIFY_PUBLIC_HOST:-certify.localhost}
      VERIFY_PUBLIC_HOST: ${VERIFY_PUBLIC_HOST:-verify.localhost}
    volumes:
      - ./scripts/make-local-certs.sh:/scripts/make-local-certs.sh:ro
      - local-certs:/certs
      - ./certs:/export
    networks:
      - injistack

  database:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      CERTIFY_PUBLIC_HOST: ${CERTIFY_PUBLIC_HOST:-certify.localhost}
    ports:
      - "5433:5432"
    volumes:
      - ./db/esignet-init.sql:/docker-entrypoint-initdb.d/00-esignet.sql:ro
      - ./db/certify_init.sql:/docker-entrypoint-initdb.d/01-certify.sql:ro
      - ./db/mimoto_init.sql:/docker-entrypoint-initdb.d/02-mimoto.sql:ro
      - ./db/verify_init.sql:/docker-entrypoint-initdb.d/03-verify.sql:ro
      - ./db/04-certify-public-host.sh:/docker-entrypoint-initdb.d/04-certify-public-host.sh:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres && psql -U postgres -d mosip_mockidentitysystem -tAc \"SELECT 1 FROM mockidentitysystem.mock_identity LIMIT 1\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks:
      - injistack

  certify:
    image: injistack/inji-certify-with-plugins:0.14.0
    user: root
    environment:
      container_user: mosip
      active_profile_env: "default,csvdp-farmer,${CERTIFY_FLOW:-preauth}"
      SPRING_CONFIG_NAME: certify
      SPRING_CONFIG_LOCATION: /home/mosip/config/
      enable_certify_artifactory: "false"
      download_hsm_client: "false"
      mosip_certify_domain_url: https://${CERTIFY_PUBLIC_HOST:-certify.localhost}:8443
      mosip_certify_data_provider_plugin_did_url: ${CERTIFY_DID:-did:web:${CERTIFY_PUBLIC_HOST:-certify.localhost}%3A8443}
      JAVA_TOOL_OPTIONS: *local-ca-java
    ports:
      - "8090:8090"
    volumes:
      - ./config/certify-default.properties:/home/mosip/config/certify-default.properties:ro
      - ./config/certify-csvdp-farmer.properties:/home/mosip/config/certify-csvdp-farmer.properties:ro
      - ./config/certify-preauth.properties:/home/mosip/config/certify-preauth.properties:ro
      - ./config/certify-esignet.properties:/home/mosip/config/certify-esignet.properties:ro
      - ./config/farmer_identity_data.csv:/home/mosip/config/farmer_identity_data.csv:ro
      - certify-data:/home/mosip/CERTIFY_PKCS12
      - local-certs:/certs:ro
    depends_on:
      database:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    networks:
      - injistack
    extra_hosts:
      - "esignet.localhost:host-gateway"

  # Public gateway for Certify and Verify (https://${CERTIFY_PUBLIC_HOST}:8443, https://${VERIFY_PUBLIC_HOST}:8443).
  # Protocol traffic goes through the playground's Protocol Tap, falling back to the services when the BFF is down.
  certify-nginx:
    image: nginx:stable
    environment:
      CERTIFY_PUBLIC_HOST: ${CERTIFY_PUBLIC_HOST:-certify.localhost}
      VERIFY_PUBLIC_HOST: ${VERIFY_PUBLIC_HOST:-verify.localhost}
    ports:
      - "8091:80"
      - "8443:8443"
    volumes:
      - ./certify/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - local-certs:/certs:ro
      - ./config/mimoto-issuers-config.json:/config/server/mimoto-issuers-config.json:ro
      - ./config/mimoto-trusted-verifiers.json:/config/server/mimoto-trusted-verifiers.json:ro
      - ./config/credential-template.html:/config/server/credential-template.html:ro
      - ./config/vp_request_config.json:/config/server/vp_request_config.json:ro
    depends_on:
      - certify
      - verify-service
      - playground-bff
    networks:
      injistack:
        # Containers resolve the public hostnames to this gateway, so the same https:// URLs work inside and outside Docker.
        aliases:
          - ${CERTIFY_PUBLIC_HOST:-certify.localhost}
          - ${VERIFY_PUBLIC_HOST:-verify.localhost}

  # ---------- Certify mock mDoc (profile mdoc) ----------
  # A second Certify from the same pinned image, configured like upstream's certify-mock-mdl.properties:
  # plugin-mode=VCIssuance with MDocMockVCIssuancePlugin, which issues an ISO mDL (mso_mdoc). That mode is
  # a global switch, so it cannot share the Farmer Certify; it gets its own database (inji_certify_mock)
  # and issuer key. Published as https://${CERTIFY_PUBLIC_HOST}:8443/mdoc/… through the gateway and the
  # Protocol Tap (:3005).
  certify-mdoc-init:
    profiles:
      - mdoc
    image: postgres:15
    entrypoint: ["/bin/sh", "/scripts/certify-mdoc-init.sh"]
    volumes:
      - ./scripts/certify-mdoc-init.sh:/scripts/certify-mdoc-init.sh:ro
      - ./db/certify_init.sql:/db/certify_init.sql:ro
      - ./db/certify-mdoc-config.sql:/db/certify-mdoc-config.sql:ro
      - certify-mdoc-key:/mdoc-key
    depends_on:
      database:
        condition: service_healthy
    networks:
      - injistack

  certify-mdoc:
    profiles:
      - mdoc
    image: injistack/inji-certify-with-plugins:0.14.0
    user: root
    environment:
      container_user: mosip
      active_profile_env: "default,mock-mdoc"
      SPRING_CONFIG_NAME: certify
      SPRING_CONFIG_LOCATION: /home/mosip/config/
      # The issuer key and certificate certify-mdoc-init made, as a Spring config tree.
      SPRING_CONFIG_IMPORT: optional:configtree:/mdoc-key/
      enable_certify_artifactory: "false"
      download_hsm_client: "false"
      mosip_certify_domain_url: https://${CERTIFY_PUBLIC_HOST:-certify.localhost}:8443/mdoc
      JAVA_TOOL_OPTIONS: *local-ca-java
    volumes:
      - ./config/certify-default.properties:/home/mosip/config/certify-default.properties:ro
      - ./config/certify-mock-mdoc.properties:/home/mosip/config/certify-mock-mdoc.properties:ro
      - certify-mdoc-data:/home/mosip/CERTIFY_PKCS12
      - certify-mdoc-key:/mdoc-key:ro
      - local-certs:/certs:ro
    depends_on:
      certify-mdoc-init:
        condition: service_completed_successfully
      certs:
        condition: service_completed_successfully
    networks:
      - injistack

  mimoto-service:
    profiles:
      - wallet
    image: injistack/mimoto:0.21.0
    user: root
    environment:
      container_user: mosip
      active_profile_env: default
      SPRING_CONFIG_NAME: mimoto
      SPRING_CONFIG_LOCATION: /home/mosip/
      SPRING_CLOUD_BOOTSTRAP_LOCATION: /home/mosip/mimoto-bootstrap.properties
      oidc_p12_password: ${OIDC_P12_PASSWORD:-local}
      WALLET_BINDING_PARTNER_API_KEY: local-wallet-binding-key
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/inji_mimoto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      GOOGLE_OAUTH_CLIENT_ID: local-google-client
      GOOGLE_OAUTH_CLIENT_SECRET: local-google-secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: *local-ca-java
    ports:
      - "8099:8099"
    volumes:
      - ./config/mimoto-default.properties:/home/mosip/mimoto-default.properties:ro
      - ./config/mimoto-bootstrap.properties:/home/mosip/mimoto-bootstrap.properties:ro
      - ./config/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json:ro
      - ./config/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json:ro
      - ./certs/oidckeystore.p12:/home/mosip/certs/oidckeystore.p12
      - local-certs:/certs:ro
    depends_on:
      database:
        condition: service_healthy
      certify-nginx:
        condition: service_started
      cbeff-schema:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - injistack
    extra_hosts:
      - "esignet.localhost:host-gateway"

  redis:
    profiles:
      - wallet
    image: redis:7-alpine
    networks:
      - injistack

  cbeff-schema:
    profiles:
      - wallet
    image: nginx:stable
    volumes:
      - ./esignet/docker-compose/cbeff:/usr/share/nginx/html:ro
    networks:
      - injistack

  mock-identity-system:
    profiles:
      - esignet
    image: mosipid/mock-identity-system:0.14.0
    user: root
    environment:
      container_user: mosip
      active_profile_env: default,local
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/mosip_mockidentitysystem?currentSchema=mockidentitysystem
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      MOSIP_ESIGNET_HOST: http://esignet:8080
    ports:
      - "8082:8082"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8082/v1/mock-identity-system/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - injistack

  esignet:
    profiles:
      - esignet
    image: mosipid/esignet:2.0.0
    user: root
    environment:
      container_user: mosip
      PORT: 8080
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      KEYMANAGER_KEYSTORE_TYPE: PKCS12
      KEYMANAGER_DB_SCHEMA: esignet
      KEYMANAGER_PKCS12_FILE_PATH: /opt/mosip/test.pfx
      KEYMANAGER_PKCS12_PASSWORD: localtest
      KEYMANAGER_PKCS12_ALLOW_INSECURE_SOFTWARE_KEYSTORE: "true"
      MOSIP_ESIGNET_CACHE_TYPE: inmemory
      MOSIP_ESIGNET_HOST: http://esignet.localhost:8088
      MOSIP_ESIGNET_OAUTH_SUPPORTED_SIGNING_ALGORITHMS: RS256,PS256,ES256,ES256K,EdDSA
      MOSIP_ESIGNET_OIDC_UI_HOSTNAME: localhost
      MOSIP_ESIGNET_OIDC_UI_PORT: "3005"
      MOSIP_ESIGNET_CAPTCHA_SITE_PROVIDER: hcaptcha
      MOSIP_ESIGNET_CAPTCHA_SITE_KEY: 10000000-ffff-ffff-ffff-000000000001
      MOSIP_ESIGNET_AUTHN_PROVIDER: mock
      MOSIP_ESIGNET_MOCK_DOMAIN_URL: http://mock-identity-system:8082
    ports:
      - "8088:8080"
    depends_on:
      database:
        condition: service_healthy
      mock-identity-system:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - injistack

  esignet-ui:
    profiles:
      - esignet
    image: mosipid/oidc-ui:2.0.0
    user: root
    environment:
      container_user: mosip
      DEFAULT_LANG: en
      DEFAULT_WELLKNOWN: "%5B%7B%22name%22%3A%22OpenID%20Configuration%22%2C%22value%22%3A%22%2F.well-known%2Fopenid-configuration%22%7D%2C%7B%22name%22%3A%22Jwks%20Json%22%2C%22value%22%3A%22%2F.well-known%2Fjwks.json%22%7D%2C%7B%22name%22%3A%22Authorization%20Server%22%2C%22value%22%3A%22%2F.well-known%2Foauth-authorization-server%22%7D%5D"
    ports:
      - "3005:3000"
    volumes:
      - ./esignet/docker-compose/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      esignet:
        condition: service_healthy
    networks:
      - injistack

  inji-web:
    profiles:
      - wallet
    image: injistack/inji-web:0.16.0
    environment:
      DEFAULT_LANG: en
      MIMOTO_URL: http://localhost:8099/v1/mimoto
    ports:
      - "3004:3004"
    volumes:
      - ./config/mimoto-default.properties:/home/mosip/mimoto-default.properties:ro
      - ./config/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json:ro
      - ./config/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json:ro
      - ./config/credential-template.html:/home/mosip/credential-template.html:ro
      - ./web/inji-web-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mimoto-service
    networks:
      - injistack

  verify-service:
    image: injistack/inji-verify-service:0.18.2
    user: root
    environment:
      active_profile_env: default
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: inji_verify
      DATABASE_SCHEMA: verify
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      INJI_VP_REQUEST_LONG_POLLING_TIMEOUT: 55000
      # request_uri and response_uri go to the public gateway (and through the tap), never to localhost,
      # so the mock wallet in Docker and a phone behind a tunnel can reach them.
      INJI_VP_SUBMISSION_BASE_URL: ${VERIFY_PUBLIC_URL:-https://verify.localhost:8443}/v1/verify
      INJI_DID_VERIFY_URI: ${VERIFY_DID:-did:web:verify.localhost%3A8443:v1:verify}
      # The request object's kid must be a key of the DID above.
      INJI_DID_VERIFY_PUBLIC_KEY_URI: ${VERIFY_DID:-did:web:verify.localhost%3A8443:v1:verify}#key-0
      INJI_KEYSTORE_FILE_PASS: mosip
      INJI_VERIFY_REDIRECT_URI: http://localhost:3000
      INJI_VERIFY_RESPONSE_CODE_EXPIRY_TIME_IN_MINS: 5
      INJI_VERIFY_CLAIMS_WITH_META_DATA: _sd,_sd_alg,iss,cnf,sub,aud,exp,nbf,iat,cti
      JAVA_TOOL_OPTIONS: *local-ca-java
    ports:
      - "8080:8080"
    volumes:
      - local-certs:/certs:ro
    depends_on:
      database:
        condition: service_started
      certs:
        condition: service_completed_successfully
    networks:
      - injistack

  verify-ui:
    image: injistack/inji-verify-ui:0.18.2
    environment:
      DEFAULT_TITLE: Inji Verify
      DEFAULT_LANG: en
      INTERNET_CONNECTIVITY_CHECK_ENDPOINT: https://dns.google/
      INTERNET_CONNECTIVITY_CHECK_TIMEOUT: 10000
      OVP_QR_HEADER: "INJI_OVP://payload="
      VERIFIABLE_CLAIMS_CONFIG_URL: /assets/config.json
      VP_SUBMISSION_SUPPORTED: "false"
      CLIENT_ID: inji-verify-ui
      CLIENT_ID_DID: ${VERIFY_DID:-did:web:verify.localhost%3A8443:v1:verify}
      DISPLAY_TIMEOUT: 120000
    ports:
      - "3000:8000"
    volumes:
      - ./config/verify-config.json:/usr/share/nginx/html/assets/config.json:ro
    depends_on:
      - verify-service
    networks:
      - injistack

  # ---------- Playground ----------
  # BFF: catalog, run orchestration, reports, live run events and the Protocol Tap (Certify tap on :3002,
  # Verify tap on :3003, mock verifier tap on :3004, Certify mock mDoc tap on :3005, all behind certify-nginx). Finished runs are kept in the playground-data volume.
  playground-bff:
    build:
      context: ..
      dockerfile: apps/playground-bff/Dockerfile
    environment:
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
      DATA_DIR: /data
      PUBLIC_UI_URL: ${PLAYGROUND_UI_URL:-http://localhost:8100}
      TAP_UPSTREAM_CERTIFY: http://certify:8090
      TAP_UPSTREAM_VERIFY: http://verify-service:8080
      TAP_UPSTREAM_MOCK_VERIFIER: http://mock-verifier:7004
      TAP_UPSTREAM_CERTIFY_MDOC: http://certify-mdoc:8090
      CERTIFY_PUBLIC_URL: https://${CERTIFY_PUBLIC_HOST:-certify.localhost}:8443
      VERIFY_PUBLIC_URL: ${VERIFY_PUBLIC_URL:-https://verify.localhost:8443}
      VERIFY_CLIENT_ID: ${VERIFY_DID:-did:web:verify.localhost%3A8443:v1:verify}
      # Catalog URLs (catalog/*.yaml reads these).
      CERTIFY_INTERNAL_URL: http://certify:8090
      VERIFY_INTERNAL_URL: http://verify-service:8080
      MOCK_WALLET_URL: http://mock-wallet:7003
      MOCK_VERIFIER_INTERNAL_URL: http://mock-verifier:7004
      CERTIFY_MDOC_INTERNAL_URL: http://certify-mdoc:8090
      INJI_WEB_INTERNAL_URL: http://inji-web:3004
      INJI_WEB_PUBLIC_URL: http://localhost:3004
      MIMOTO_PUBLIC_URL: http://localhost:8099
      INJI_HEALTH_TARGETS: >-
        [
          {"name": "certify", "url": "http://certify:8090/v1/certify/actuator/health"},
          {"name": "certify-public", "url": "https://${CERTIFY_PUBLIC_HOST:-certify.localhost}:8443/.well-known/openid-credential-issuer"},
          {"name": "verify-service", "url": "http://verify-service:8080/v1/verify/actuator/health"},
          {"name": "verify-public", "url": "${VERIFY_PUBLIC_URL:-https://verify.localhost:8443}/v1/verify/did.json"},
          {"name": "verify-ui", "url": "http://verify-ui:8000/"},
          {"name": "mock-wallet", "url": "http://mock-wallet:7003/health"},
          {"name": "mock-verifier", "url": "http://mock-verifier:7004/mock-verifier/health", "optional": true},
          {"name": "certify-mdoc", "url": "http://certify-mdoc:8090/v1/certify/actuator/health", "optional": true},
          {"name": "esignet", "url": "http://esignet:8080/health", "optional": true},
          {"name": "mimoto", "url": "http://mimoto-service:8099/v1/mimoto/issuers", "optional": true},
          {"name": "inji-web", "url": "http://inji-web:3004/", "optional": true}
        ]
    ports:
      - "8101:3001"
    volumes:
      - local-certs:/certs:ro
      - playground-data:/data
    depends_on:
      certs:
        condition: service_completed_successfully
    networks:
      - injistack

  # Headless wallet for runs without a phone. It reaches Certify and Verify on their public https URLs
  # (network aliases on certify-nginx), so its traffic passes the Protocol Tap like a real wallet's.
  mock-wallet:
    build:
      context: ..
      dockerfile: apps/mock-wallet/Dockerfile
    environment:
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
    ports:
      - "8104:7003"
    volumes:
      - local-certs:/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
    networks:
      - injistack

  # Mock verifier: the playground's own OpenID4VP verifier, not Inji. Published as /mock-verifier/… on
  # the Verify host through the gateway and the Protocol Tap; its did:web resolves there too.
  mock-verifier:
    build:
      context: ..
      dockerfile: apps/mock-verifier/Dockerfile
    environment:
      PUBLIC_URL: ${VERIFY_PUBLIC_URL:-https://verify.localhost:8443}/mock-verifier
      # Empty: derived from PUBLIC_URL (did:web:<verify-host>%3A8443:mock-verifier).
      CLIENT_ID: ${MOCK_VERIFIER_DID:-}
      # Certify's SD-JWT `iss` is mosip.certify.domain.url. Other issuers are accepted with a warning.
      TRUSTED_ISSUERS: https://${CERTIFY_PUBLIC_HOST:-certify.localhost}:8443
      # mDoc issuer certificates to trust (certify-mdoc's, when the mdoc profile has made it).
      TRUSTED_MDOC_CERTS: /trust/issuer.crt
    ports:
      - "8105:7004"
    volumes:
      - certify-mdoc-key:/trust:ro
    networks:
      - injistack

  # Playground UI. nginx serves it and proxies /api and /socket.io to playground-bff on the same origin.
  # PLAYGROUND_UI_MOCKS=true builds the in-browser mock mode instead (no BFF needed).
  playground-ui:
    build:
      context: ..
      dockerfile: apps/playground-ui/Dockerfile
      args:
        VITE_USE_MOCKS: ${PLAYGROUND_UI_MOCKS:-false}
    ports:
      - "8100:80"
    depends_on:
      - playground-bff
    networks:
      - injistack

networks:
  injistack:
    name: injistack

volumes:
  postgres-data:
  certify-data:
  certify-mdoc-data:
  certify-mdoc-key:
  local-certs:
  playground-data:
