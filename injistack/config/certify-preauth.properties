## Issuance flow "preauth" (CERTIFY_FLOW=preauth, the default).
## Certify is its own authorization server: a caller (the playground BFF, a test script) creates a
## pre-authorized credential offer with the claims to issue, the wallet redeems it at Certify's token
## endpoint, and the credential is built from those claims. No eSignet or Mimoto involved.
## Token issuer and JWKS defaults live in certify-default.properties.
mosip.certify.integration.data-provider-plugin=PreAuthDataProviderPlugin
