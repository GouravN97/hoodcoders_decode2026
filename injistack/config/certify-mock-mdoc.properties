# Second Certify (certify-mdoc): Certify's own mock mDoc issuance, as upstream's
# docker-compose-injistack/config/certify-mock-mdl.properties configures it. plugin-mode=VCIssuance
# is a global switch, so this runs next to the Farmer Certify, not inside it, with its own database.
# The issuer key and certificate (mosip.certify.mock.mdoc.issuer-key-cert) are generated at start-up
# by certify-mdoc-init and read from a config tree; they are never committed.
mosip.certify.integration.scan-base-package=io.mosip.certify.mock.integration
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.integration.vci-plugin=MDocMockVCIssuancePlugin
mosip.certify.plugin-mode=VCIssuance
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2018
# Required at start-up by the status-list service even in VCIssuance mode; mDoc issuance does not use it.
mosip.certify.data-provider-plugin.did-url=did:web:certify-mdoc.invalid

mosip.certify.cache.secure.individual-id=false
mosip.certify.cache.store.individual-id=false
mosip.certify.cache.security.algorithm-name=AES/ECB/PKCS5Padding
mosip.certify.mock.vciplugin.mdoc.issuer-key-cert=${mosip.certify.mock.mdoc.issuer-key-cert}

spring.datasource.url=jdbc:postgresql://${mosip.certify.database.hostname}:${mosip.certify.database.port}/inji_certify_mock?currentSchema=certify

mosip.certify.credential-config.issuer.display={\
  {\
    'name': 'Playground mock mDoc issuer (Inji Certify)',\
    'locale': 'en'\
  }\
}
