## Issuance flow "esignet" (CERTIFY_FLOW=esignet), for the Mimoto / Inji Web authorization-code flow.
## Certify trusts access tokens from the local eSignet and looks the holder up in the farmer CSV
## (csvdp-farmer profile) by the token's subject. Pre-authorized offers do not work in this mode.
mosip.certify.authorization.url=http://esignet.localhost:8088
mosip.certify.authn.jwk-set-uri=http://esignet.localhost:8088/oauth2/jwks
mosip.certify.integration.data-provider-plugin=MockCSVDataProviderPlugin
