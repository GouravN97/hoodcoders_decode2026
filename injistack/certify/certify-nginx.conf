server {
    # Plain HTTP inside the Docker network (Mimoto's config server, older clients).
    listen 80;
    # Public HTTPS address: https://$CERTIFY_PUBLIC_HOST:8443. Containers reach it through the
    # network alias on this service, browsers on the host through the published port.
    listen 8443 ssl;
    ssl_certificate     /certs/certify.crt;
    ssl_certificate_key /certs/certify.key;
    # Default location for normal static files

    location / {
        root /config/server;
        autoindex on;
    }

    # Proxy API requests to mimoto-service
    location /v1/certify/ {
        proxy_pass http://certify:8090/v1/certify/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        # Handle OPTIONS requests (for pre-flight checks)
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location /.well-known/did.json {
            proxy_pass http://certify:8090/v1/certify/.well-known/did.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Add CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

            # Handle OPTIONS requests (for pre-flight checks)
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
        location /.well-known/openid-credential-issuer {
                    proxy_pass http://certify:8090/v1/certify/.well-known/openid-credential-issuer;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";

                    # Add CORS headers
                    add_header 'Access-Control-Allow-Origin' '*' always;
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

                    # Handle OPTIONS requests (for pre-flight checks)
                    if ($request_method = 'OPTIONS') {
                        return 204;
                    }
                }

    # OAuth authorization server metadata (RFC 8414) for Certify acting as its own token issuer.
    location /.well-known/oauth-authorization-server {
        proxy_pass http://certify:8090/v1/certify/.well-known/oauth-authorization-server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}