server {
    listen 80;
    root /usr/share/nginx/html;

    # Look the BFF up per request (Docker DNS), so the UI starts even when the BFF is not running.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bff http://playground-bff:3001;

    # Single-page app: client-side routes such as /runs/:id fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The mock service worker must always be fresh.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-store";
    }

    # Same-origin API and run events, for builds with VITE_USE_MOCKS=false.
    location /api/ {
        proxy_pass $bff;
        proxy_set_header Host $host;
    }
    location /socket.io/ {
        proxy_pass $bff;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
