# Inji Verify — OpenID4VP verifier service.
id: inji-verify
role: verifier
displayName: Inji Verify
description: "MOSIP's verifier. Requests credentials over OpenID4VP and checks signature, expiry and status."
vendor: inji
adapter: InjiVerifyServiceAdapter
publicUrl: ${VERIFY_PUBLIC_URL:-https://verify.localhost:8443}
internalUrl: ${VERIFY_INTERNAL_URL:-http://localhost:8080}
# Inji Verify exposes no version endpoint, so the version is the pinned image tag.
versionProbe:
  kind: static
  value: ${VERIFY_VERSION:-0.18.2}
capabilities:
  formats: [ldp_vc, vc+sd-jwt]
  proofSuites: [Ed25519Signature2020, ES256, RsaSignature2018]
  vpProfiles: [oid4vp-draft23]
  queryLanguages: [presentation_exchange]
  responseModes: [direct_post]
  clientIdSchemes: [pre-registered, did]
  presentationFlows: [cross-device-qr, same-device-deeplink]
  deliveryChannels: [qr, deeplink]
  automation: headless
  supportsTamper: false
notes: Pinned to 0.18.2, the Presentation Exchange lane; 1.0.x switches to DCQL.
