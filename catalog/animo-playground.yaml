# Animo's public OpenID4VCI 1.0 interoperability test issuer.
id: animo-playground
role: issuer
displayName: Animo Playground
description: 'Public Animo test issuer. Creates Bundesdruckerei EUDI PID offers for testing external OpenID4VCI 1.0 issuance into a wallet. Use Issue only for wallet-import checks.'
vendor: external
adapter: AnimoPlaygroundIssuerAdapter
publicUrl: https://playground.animo.id
versionProbe:
  kind: static
  value: live
capabilities:
  formats: [dc+sd-jwt, mso_mdoc]
  proofSuites: [ES256]
  grantTypes: [pre-authorized_code]
  vciProfiles: [oid4vci-1.0]
  deliveryChannels: [qr, deeplink]
  automation: headless
  supportsTamper: false
notes: >-
  The phone talks to Animo directly, outside the local Protocol Tap. The holder therefore confirms
  successful storage from the run page. The adapter requests no authentication, deferral, DPoP,
  wallet attestation or key attestation so the offer exercises the simplest supported flow.
