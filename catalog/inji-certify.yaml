# Inji Certify — OpenID4VCI issuer. Schema: CatalogFileSchema in packages/shared/src/catalog.ts
# ${VAR:-default} values are filled in from the BFF's environment (injistack/docker-compose.yml sets them).
id: inji-certify
role: issuer
displayName: Inji Certify
description: "MOSIP's credential issuer. Issues JSON-LD and SD-JWT credentials over OpenID4VCI."
vendor: inji
adapter: InjiCertifyIssuerAdapter
publicUrl: ${CERTIFY_PUBLIC_URL:-https://certify.localhost:8443}
internalUrl: ${CERTIFY_INTERNAL_URL:-http://localhost:8090}
# Certify's actuator/info needs authentication, so the version is the pinned image tag.
versionProbe:
  kind: static
  value: ${CERTIFY_VERSION:-0.14.0}
capabilities:
  # mso_mdoc comes from a second Certify in mock mDoc mode: catalog/inji-certify-mdoc.yaml.
  formats: [ldp_vc, vc+sd-jwt]
  proofSuites: [Ed25519Signature2020, ES256]
  grantTypes: [pre-authorized_code, authorization_code]
  vciProfiles: [oid4vci-draft13]
  didMethods: [did:web]
  deliveryChannels: [api]
  automation: headless
  supportsTamper: false
  # Copies signed with validity in the past (injistack/db/certify_init.sql), for the T-EXPIRED tamper.
  expiredVariants:
    FarmerCredential: FarmerCredentialExpired
    FarmerCredentialSdJwt: FarmerCredentialSdJwtExpired
notes: SD-JWT is issued as vc+sd-jwt only.
