# Mock verifier (apps/mock-verifier): the playground's own OpenID4VP draft-23 verifier, not Inji.
# Published as /mock-verifier/… on the Verify host, with client_id did:web:<verify-host>:mock-verifier.
id: mock-verifier
role: verifier
displayName: Mock verifier
description: "A standards-based OpenID4VP verifier that is not Inji. Reports every check it makes, one by one."
vendor: mock
adapter: MockVerifierAdapter
publicUrl: ${VERIFY_PUBLIC_URL:-https://verify.localhost:8443}/mock-verifier
internalUrl: ${MOCK_VERIFIER_INTERNAL_URL:-http://localhost:7004}
versionProbe:
  kind: static
  value: 0.1.0
capabilities:
  # SD-JWT VC and ISO mDoc (DeviceResponse, ISO 18013-7 Annex B session transcript); a JSON-LD
  # presentation is answered "not checked by this verifier".
  formats: [vc+sd-jwt, dc+sd-jwt, mso_mdoc]
  proofSuites: [ES256, EdDSA]
  # draft 23 + Presentation Exchange for openid4vp:// requests; OpenID4VP 1.0 + DCQL over the
  # Digital Credentials API (unsigned requests, SD-JWT VC only).
  vpProfiles: [oid4vp-draft23, oid4vp-1.0]
  queryLanguages: [presentation_exchange, dcql]
  responseModes: [direct_post, dc_api]
  clientIdSchemes: [did]
  presentationFlows: [cross-device-qr, same-device-deeplink, dc-api]
  deliveryChannels: [qr, deeplink]
  automation: headless
  supportsTamper: false
notes: Signed request object (EdDSA JAR) by reference. Trusts the issuers in TRUSTED_ISSUERS; any other issuer is accepted with a warning.
